<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GON PLAN</title>

    <!-- PWA -->
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GON PLAN">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 max-w-lg pb-10">
        <!-- 헤더 -->
        <header class="text-center pt-8 pb-6">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">GON PLAN</h1>
        </header>

        <!-- 카테고리 탭 -->
        <div class="tab-bar grid grid-cols-5 gap-1 bg-white rounded-xl shadow p-1 mb-6 sticky top-2 z-10">
            <button class="tab-btn active" data-category="daily">일일활동</button>
            <button class="tab-btn" data-category="todo">해야할일</button>
            <button class="tab-btn" data-category="wish">하고싶은 것</button>
            <button class="tab-btn" data-category="want">원하는 것</button>
            <button class="tab-btn" data-category="like">좋아하는 것</button>
        </div>

        <!-- 입력 폼 (일일활동 탭에서는 숨김: 해야할일에서만 추가) -->
        <div id="addFormCard" class="bg-white rounded-xl shadow p-4 mb-6">
            <form id="itemForm" class="flex gap-2">
                <input
                    type="text"
                    id="itemInput"
                    placeholder="항목을 입력하세요..."
                    class="flex-1 px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-gray-700 placeholder-gray-400"
                    required
                    autocomplete="off"
                >
                <button
                    type="submit"
                    class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg font-bold shadow hover:bg-indigo-700 transition-all"
                >
                    추가
                </button>
            </form>
        </div>

        <!-- 목록 -->
        <div id="itemListContainer" class="space-y-3 mb-6">
            <!-- 동적으로 생성됨 -->
        </div>

        <!-- 빈 상태 메시지 -->
        <div id="emptyState" class="text-center py-16 hidden">
            <p class="text-gray-400 text-base" id="emptyStateText">아직 등록된 항목이 없습니다.</p>
        </div>
    </div>

    <!-- 수정 모달 -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="text-xl font-bold mb-5 text-gray-800">항목 수정</h3>
            <form id="editForm">
                <input
                    type="text"
                    id="editInput"
                    class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all mb-5 text-gray-700"
                    required
                >
                <div class="flex gap-2 justify-end">
                    <button
                        type="button"
                        id="cancelEdit"
                        class="px-5 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-all font-medium"
                    >
                        취소
                    </button>
                    <button
                        type="submit"
                        class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all font-medium"
                    >
                        저장
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        // 서비스워커 등록 (PWA 오프라인/홈 화면 설치 지원)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
